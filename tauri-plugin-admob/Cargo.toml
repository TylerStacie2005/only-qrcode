[package]
name = "tauri-plugin-admob"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin for Google AdMob interstitial and rewarded ads (iOS and Android)"
links = "tauri-plugin-admob"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
