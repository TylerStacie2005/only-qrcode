[package]
name = "only-qrcode"
version = "1.1.5"
description = "Simple QR code generator and reader. Free, no account."
authors = ["Tyler Mecham"]
license = "MIT"
repository = "https://github.com/TylerStacie2005/only-qrcode"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-admob = { path = "../tauri-plugin-admob" }
base64 = "0.22"
tauri-plugin-mcp-bridge = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[patch.crates-io]
# Xcode 27: export swift-rs runtime symbols (see vendor/swift-rs/src-rs/build.rs)
swift-rs = { path = "vendor/swift-rs" }
